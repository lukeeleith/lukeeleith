<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fullsize Image</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; /* Verhindert Scrollen */
        }

        .fullscreen-bg {
            width: 100%;
            height: 100vh;
            background-image: url('affe_mittelfinger.jpg'); /* Ersetze dies durch deine Bild-URL */
            background-size: cover; /* Bild füllt den Raum aus */
            background-position: center; /* Bild bleibt zentriert */
            background-repeat: no-repeat;
        }
    </style>
</head>
<body>

    <div class="fullscreen-bg"></div>

</body>
</html>
