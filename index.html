<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fullsize Image</title>
    <style>
    body {
        margin: 0;
        display: flex;
        justify-content: center; /* Bild horizontal zentrieren */
        align-items: center;     /* Bild vertikal zentrieren */
        height: 100vh;
        background-color: #f0f0f0; /* Hintergrundfarbe für den leeren Bereich */
    }

    .fullscreen-bg {
        width: 10%;              /* Hier Breite anpassen (z. B. 50% oder 500px) */
        height: 10%;             /* Hier Höhe anpassen */
        background-image: url('affe_mittelfinger.jpg');
        background-size: contain; /* Bild wird nicht abgeschnitten */
        background-position: center;
        background-repeat: no-repeat;
    }
</style
</head>
<body>

    <div class="fullscreen-bg"></div>

</body>
</html>
